{% extends 'base.html' %}{% block content %}<h1>سجلات {{model.name}}</h1><div class='card'><form method='post' class='stack'><input name='record_key' placeholder='123'><textarea name='payload_json' rows='12'>{}</textarea><button class='btn'>حفظ السجل</button></form></div>{% for r in rows %}<div class='card'><b>{{r.record_key}}</b><span class='muted'>v{{r.version}} • {{r.checksum}}</span><pre>{{r.payload_json|tojson(indent=2)}}</pre></div>{% endfor %}{% endblock %}
