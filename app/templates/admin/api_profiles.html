{% extends 'base.html' %}{% block content %}<h1>API Profiles</h1><div class='card'><form method='post' class='stack'><div class='form-grid'><input name='slug' placeholder='main_api'><input name='name' placeholder='Main API'><input name='base_url' placeholder='https://api.example.com'><input name='timeout_seconds' type='number' value='20'><input name='allowed_hosts' placeholder='api.example.com'></div><label><input type='checkbox' name='verify_tls' checked> Verify TLS</label><textarea name='default_headers' rows='5'>{}</textarea><textarea name='auth_config' rows='5'>{}</textarea><button class='btn'>حفظ API Profile</button></form></div>{% for r in rows %}<div class='card'><b>{{r.name}}</b><div>{{r.slug}}</div><code>{{r.base_url}}</code></div>{% endfor %}{% endblock %}
