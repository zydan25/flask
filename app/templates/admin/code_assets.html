{% extends 'base.html' %}{% block content %}<h1>Code Assets</h1><div class='card'><form method='post' class='stack'><div class='form-grid'><input name='slug' placeholder='custom_action'><input name='name' placeholder='Custom Action'><input name='language' value='python'><input name='entrypoint' placeholder='handler_name'></div><textarea name='source_code' rows='18' placeholder='الكود يُخزن فقط؛ التنفيذ المباشر معطل افتراضيًا'></textarea><button class='btn'>حفظ Code Asset</button></form></div>{% for r in rows %}<div class='card'><b>{{r.name}}</b><div>{{r.language}} • {{r.execution_policy}}</div><pre>{{r.source_code}}</pre></div>{% endfor %}{% endblock %}
