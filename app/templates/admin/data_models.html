{% extends 'base.html' %}{% block content %}<h1>قاعدة بيانات التطبيق</h1><div class='card'><form method='post' class='stack'><div class='form-grid'><input name='slug' placeholder='customers'><input name='name' placeholder='العملاء'></div><textarea name='schema_json' rows='10'>{"fields":{"id":{"type":"string","required":true},"name":{"type":"string"}}}</textarea><textarea name='indexes_json' rows='4'>[]</textarea><textarea name='sync_policy_json' rows='4'>{"conflict":"server_wins"}</textarea><button class='btn'>إنشاء Data Model</button></form></div>{% for r in rows %}<div class='card'><div class='row'><div><b>{{r.name}}</b><span>{{r.slug}}</span></div><a class='btn secondary' href='/admin/data-models/{{r.id}}/records'>السجلات</a></div><pre>{{r.schema_json|tojson(indent=2)}}</pre></div>{% endfor %}{% endblock %}
