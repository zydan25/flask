{% extends 'base.html' %}{% block content %}<h1>شاشات STAC — {{app.name}}</h1><div class='card'><form method='post' class='stack'><div class='form-grid'><input name='slug' placeholder='dashboard' required><input name='title' placeholder='عنوان الشاشة'><input name='route' placeholder='/dashboard'><input name='order_index' type='number' value='0'></div><label><input type='checkbox' name='enabled' checked> مفعلة</label><label><input type='checkbox' name='login_required'> تتطلب دخول</label><label><input type='checkbox' name='home'> Home</label><textarea name='stac_json' rows='14'>{}</textarea><textarea name='metadata_json' rows='6'>{}</textarea><button class='btn'>إضافة شاشة</button></form></div>{% for r in rows %}<div class='card'><div class='row'><div><b>{{r.title}}</b><span class='muted'>{{r.slug}} — {{r.route}}</span></div><a class='btn secondary' href='/admin/screens/{{r.id}}'>تعديل</a></div><pre>{{r.stac_json|tojson(indent=2)}}</pre></div>{% endfor %}{% endblock %}
