{% extends 'base.html' %}{% block content %}<h1>تعديل الشاشة</h1><div class='card'><form method='post' class='stack'><input name='slug' value='{{row.slug}}'><input name='title' value='{{row.title}}'><input name='route' value='{{row.route}}'><input name='order_index' type='number' value='{{row.order_index}}'><label><input type='checkbox' name='enabled' {% if row.enabled %}checked{% endif %}> مفعلة</label><label><input type='checkbox' name='login_required' {% if row.login_required %}checked{% endif %}> دخول</label><label><input type='checkbox' name='home' {% if row.home %}checked{% endif %}> Home</label><textarea name='stac_json' rows='26'>{{row.stac_json|tojson(indent=2)}}</textarea><textarea name='metadata_json' rows='8'>{{row.metadata_json|tojson(indent=2)}}</textarea><button class='btn'>حفظ</button></form></div>{% endblock %}
