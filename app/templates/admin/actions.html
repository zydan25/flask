{% extends 'base.html' %}{% block content %}<h1>Actions</h1><div class='card'><form method='post' class='stack'><div class='form-grid'><input name='slug' placeholder='submit_form'><input name='name' placeholder='إرسال النموذج'><input name='trigger' placeholder='form.submit'><input name='permission' placeholder='customers.update'></div><textarea name='definition_json' rows='16'>{"type":"workflow","steps":[]}</textarea><button class='btn'>حفظ Action</button></form></div>{% for r in rows %}<div class='card'><b>{{r.name}}</b><div>{{r.slug}} • {{r.trigger}}</div><pre>{{r.definition_json|tojson(indent=2)}}</pre></div>{% endfor %}{% endblock %}
