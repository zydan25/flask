{% extends 'base.html' %}{% block content %}<h1>API Endpoints</h1><div class='card'><form method='post' class='stack'><div class='form-grid'><select name='profile_id'>{% for p in profiles %}<option value='{{p.id}}'>{{p.name}}</option>{% endfor %}</select><input name='slug' placeholder='customers'><select name='method'><option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option></select><input name='path' placeholder='/customers'></div><textarea name='request_schema' rows='5'>{}</textarea><textarea name='response_mapping' rows='5'>{}</textarea><textarea name='error_mapping' rows='5'>{}</textarea><button class='btn'>حفظ Endpoint</button></form></div>{% for r in rows %}<div class='card'><b>{{r.slug}}</b><div>{{r.method}} {{r.path}}</div></div>{% endfor %}{% endblock %}
