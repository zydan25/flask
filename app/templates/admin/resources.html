{% extends 'base.html' %}{% block content %}<h1>Resources</h1><div class='card'><form method='post' class='stack'><div class='form-grid'><input name='key' placeholder='profile'><select name='resource_type'><option>json</option><option>collection</option><option>entity</option></select><input name='endpoint' placeholder='/gateway/flutter-app/customers'><select name='cache_policy'><option>network_first</option><option>cache_first</option><option>stale_while_revalidate</option><option>network_only</option></select><input name='ttl_seconds' type='number' value='300'></div><textarea name='payload_json' rows='10'>{}</textarea><textarea name='metadata_json' rows='5'>{}</textarea><button class='btn'>حفظ Resource</button></form></div>{% for r in rows %}<div class='card'><b>{{r.key}}</b><div>{{r.cache_policy}} • TTL {{r.ttl_seconds}}</div><pre>{{r.payload_json|tojson(indent=2)}}</pre></div>{% endfor %}{% endblock %}
